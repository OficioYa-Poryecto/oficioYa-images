server:
  # 8083 en local para no chocar con Worker (8082). En Azure se sobreescribe con SERVER_PORT.
  port: ${PORT:8083}

spring:
  application:
    name: image-service
  # En local se pueden poner las variables en un archivo .env junto al pom.xml (ignorado por git)
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/oficioya_images}
    representation:
      # UUID en formato estandar para que otros servicios y herramientas los lean igual
      uuid: standard
  data:
    mongodb:
      # Crea el indice compuesto (rootId, tipo, activo) definido en ImageDocument
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

jwt:
  # Sin valor por defecto: si falta JWT_SECRET la aplicacion no arranca.
  # Debe ser la misma clave Base64 con la que Identity firma los tokens.
  secret: ${JWT_SECRET}

cors:
  # Origenes del front separados por coma. En Azure se pone la URL del front desplegado.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    eci.edu.dosw: INFO
